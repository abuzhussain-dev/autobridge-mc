pluginManagement {
  repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    gradlePluginPortal()
  }
  plugins {
    id("fabric-loom") version providers.gradleProperty("loom_version").get()
  }
  resolutionStrategy {
    eachPlugin {
      if (requested.id.id == 'fabric-loom') {
        useModule("net.fabricmc:fabric-loom:${requested.version}")
      }
    }
  }
}
